name: Update buoy reading
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest Torrey Pines buoy (NDBC 46225)
        run: |
          curl -sSf -A "waive (github.com/jakefeehan/waive)" https://www.ndbc.noaa.gov/data/realtime2/46225.txt -o raw.txt
          python3 - <<'PY'
          import json
          for line in open("raw.txt"):
              if line.startswith("#") or not line.strip():
                  continue
              c = line.split()
              if c[8] == "MM":
                  continue
              n = lambda v: None if v == "MM" else float(v)
              out = {"t": "%s-%s-%sT%s:%s:00Z" % tuple(c[:5]), "hs": n(c[8]), "dpd": n(c[9]), "mwd": n(c[11]), "wtmpC": n(c[14])}
              json.dump(out, open("data/buoy.json", "w"))
              break
          PY
          rm raw.txt
      - name: Save if changed
        run: |
          git config user.name "waive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/buoy.json
          git diff --cached --quiet || (git commit -m "Update buoy reading" && git push)
