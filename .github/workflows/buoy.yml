name: Update buoy reading
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest Torrey Pines buoy (NDBC 46225)
        run: |
          curl -sSf -A "waive (github.com/jakefeehan/waive)" https://www.ndbc.noaa.gov/data/realtime2/46225.txt -o raw.txt
          python3 - <<'PY'
          import json
          out = {}
          for line in open("raw.txt"):
              if line.startswith("#") or not line.strip():
                  continue
              c = line.split()
              n = lambda v: None if v == "MM" else float(v)
              stamp = "%s-%s-%sT%s:%s:00Z" % tuple(c[:5])
              # waves and water temperature are often reported at different times, so each keeps its own newest reading and time
              if "t" not in out and c[8] != "MM":
                  out.update({"t": stamp, "hs": n(c[8]), "dpd": n(c[9]), "mwd": n(c[11])})
              if "wtmpT" not in out and c[14] != "MM":
                  out.update({"wtmpC": n(c[14]), "wtmpT": stamp})
              if "t" in out and "wtmpT" in out:
                  break
          if "t" in out:
              json.dump(out, open("data/buoy.json", "w"))
          PY
          rm raw.txt
      - name: Save if changed
        run: |
          git config user.name "waive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/buoy.json
          git diff --cached --quiet || (git commit -m "Update buoy reading" && git push)
