name: Save forecast for the accuracy scorecard
on:
  schedule:
    - cron: "40 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save today's forecast and the buoy history
        run: python3 scripts/log_forecast.py
      - name: Save if changed
        run: |
          git config user.name "waive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/forecast-log.json data/observed.json
          git diff --cached --quiet || (git commit -m "Save forecast and buoy history" && git pull --rebase -q && git push)
