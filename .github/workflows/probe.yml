name: Probe data sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_feeds.py
      - run: python3 scripts/snapshot.py
      - run: |
          git config user.name "waive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Probe data" && git push
