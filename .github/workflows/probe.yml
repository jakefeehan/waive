name: Probe data sources
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CDIP MOP files
        run: |
          python3 - <<'PY'
          import re, urllib.request, time
          UA = {"User-Agent": "waive (github.com/jakefeehan/waive)"}
          def get(u, n=3000, to=25):
              t = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=to) as r:
                      b = r.read(n).decode("utf-8", "replace")
                      return "OK %.1fs\n%s" % (time.time() - t, b)
              except Exception as e:
                  return "FAIL %s %.1fs" % (e, time.time() - t)
          base = "https://thredds.cdip.ucsd.edu/thredds/dodsC/cdip/model/"
          for u in [base + "MOP_alongshore/D0549_forecast.nc.das", base + "MOP_alongshore/D0549_nowcast.nc.das",
                    base + "MOP_grids/B_0.001_forecast.nc.das", base + "MOP_validation/D0549_forecast.nc.das"]:
              print("=== " + u); print(get(u, 2500)); print()
          PY
