name: Probe data sources
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CDIP MOP sites
        run: |
          python3 - <<'PY'
          import urllib.request
          UA = {"User-Agent": "waive (github.com/jakefeehan/waive)"}
          base = "https://thredds.cdip.ucsd.edu/thredds/dodsC/cdip/model/MOP_alongshore/"
          def get(u, n=600):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30) as r:
                      return r.read(n).decode("utf-8", "replace").replace("\n", " | ")
              except Exception as e:
                  return "FAIL %s" % e
          for n in range(500, 700, 10):
              print("D%04d" % n, get(base + "D%04d_forecast.nc.ascii?metaLatitude,metaLongitude,metaWaterDepth" % n, 400))
          print("TIME", get(base + "D0549_forecast.nc.ascii?waveTime[0:1:2]"))
          print("HS", get(base + "D0549_forecast.nc.ascii?waveHs[0:1:2]"))
          print("DIM", get(base + "D0549_forecast.nc.dds", 800))
          PY
