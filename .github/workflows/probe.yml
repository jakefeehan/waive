name: Probe data sources
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import urllib.request, re, json
          UA = {"User-Agent": "waive (github.com/jakefeehan/waive)"}
          base = "https://thredds.cdip.ucsd.edu/thredds/dodsC/cdip/model/MOP_alongshore/"
          def get(u, n=600):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30) as r:
                      return r.read(n).decode("utf-8", "replace")
              except Exception as e:
                  return "FAIL %s" % e
          for n in range(380, 500, 2):
              t = get(base + "D%04d_forecast.nc.ascii?metaLatitude,metaLongitude" % n, 400)
              m = re.findall(r"meta\w+, ([-\d.]+)", t)
              print("D%04d" % n, m if m else t[:80])
          print("DDS", get(base + "D0450_forecast.nc.dds", 3000)[700:].replace("\n", " | "))
          print("NOW", get(base + "D0450_nowcast.nc.dds", 500).replace("\n", " | "))
          print("ROW", get(base + "D0450_forecast.nc.ascii?waveTime[0:1:3],waveHs[0:1:3],waveTp[0:1:3],waveDp[0:1:3],waveTa[0:1:3],waveFrequency,waveBandwidth,waveEnergyDensity[0:1:0][0:1:27]", 3000).replace("\n", " | "))
          om = "https://marine-api.open-meteo.com/v1/marine?latitude=32.80&longitude=-117.28&hourly=wave_height,swell_wave_height,swell_wave_period,swell_wave_direction,secondary_swell_wave_height,secondary_swell_wave_period,secondary_swell_wave_direction,wind_wave_height,wind_wave_period&forecast_days=1&timezone=GMT"
          for mdl in ["", "&models=ecmwf_wam025,ncep_gfswave025", "&models=ncep_gfswave016", "&models=meteofrance_wave"]:
              t = get(om + mdl, 200000)
              try:
                  j = json.loads(t)["hourly"]
                  print("OM", mdl, {k: v[12] for k, v in j.items()})
              except Exception as e:
                  print("OM", mdl, "ERR", t[:300])
          for b in ["46254", "46258", "46225"]:
              for ext in ["txt", "spec"]:
                  print(b, ext, get("https://www.ndbc.noaa.gov/data/realtime2/%s.%s" % (b, ext), 420).replace("\n", " | "))
          PY
